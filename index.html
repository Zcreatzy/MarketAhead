<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarketAhead | 每日市场简报</title>
  <meta name="description" content="A股港股早报与美股盘前简报的每日图文汇总。">
  <style>
    :root{color-scheme:light;--bg:#f4f6f8;--panel:#fff;--soft:#f9fafb;--ink:#151d26;--muted:#687585;--line:#dce3eb;--teal:#007481;--amber:#b45309;--green:#087f5b;--red:#b42318;--shadow:0 18px 48px rgba(20,31,44,.08)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.58}main{width:min(1860px,calc(100% - 32px));margin:0 auto;padding:24px 0 48px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}h2,h3,p{margin-top:0}h2{font-size:22px;margin:0}h3{font-size:16px;margin:0 0 10px}.page-shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}.history-sidebar{position:sticky;top:18px;padding:16px}.calendar-window{border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:10px}.calendar-month{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:760}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar-grid span,.calendar-grid a{height:32px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:12px;text-decoration:none;display:grid;place-items:center}.calendar-grid .dow{height:auto;font-size:11px;font-weight:760}.calendar-grid a{cursor:pointer;background:#fff;border-color:var(--line);color:var(--ink);font-weight:720}.calendar-grid a:hover,.calendar-grid a:focus{outline:2px solid rgba(0,116,129,.22);border-color:var(--teal)}.calendar-grid a.active{background:var(--teal);border-color:var(--teal);color:#fff}.calendar-grid a.has-ah:after,.calendar-grid a.has-us:before{content:"";display:block;width:7px;height:7px;border-radius:999px;margin:1px auto 0;box-shadow:0 0 0 2px #fff}.calendar-grid a.has-ah:after{background:#39ff88}.calendar-grid a.has-us:before{background:#ff9f1a}.calendar-grid a.active.has-ah:after{box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(57,255,136,.38)}.calendar-grid a.active.has-us:before{box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(255,159,26,.34)}.history-legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;color:var(--muted);font-size:12px}.history-legend i{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:4px}.history-legend span:first-child i{background:#39ff88}.history-legend span:last-child i{background:#ff9f1a}.record-banner{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;padding:12px 14px}.record-banner strong{font-size:16px}.record-banner span{color:var(--muted);font-size:12px}.brief-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.brief-header{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:20px 22px 16px;background:linear-gradient(180deg,#fff 0%,#fbfcfd 100%)}.brief-kicker{color:var(--teal);font-size:13px;font-weight:750;margin-bottom:4px}.brief-time{color:var(--muted);font-size:12px;text-align:right;min-width:128px}.brief-content{padding:18px}.brief-dashboard{display:grid;gap:12px}.module-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.module{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:14px}.module.full{grid-column:1/-1}.collapsible-news{padding:0;overflow:hidden}.collapsible-news>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;font-size:16px;font-weight:760}.collapsible-news>summary::-webkit-details-marker{display:none}.collapsible-news>summary:after{content:"收起";border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);font-size:12px;font-weight:650;background:#fff;white-space:nowrap}.collapsible-news:not([open])>summary:after{content:"展开"}.collapsible-news>.news-list{padding:0 14px 14px}.takeaway{border-left:4px solid var(--teal);background:#f1fbfc}.news-list{display:grid;gap:8px}.news-item{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px}.news-tag{border-radius:999px;padding:3px 8px;text-align:center;font-size:12px;font-weight:750}.news-tag.geo{background:#fff0ee;color:var(--red)}.news-tag.tech{background:#eef6f3;color:var(--green)}.news-tag.earn{background:#fff6e8;color:var(--amber)}.news-title{font-weight:740}.news-detail{color:var(--muted);font-size:13px;margin-top:2px}.asset-strip{display:grid;gap:8px}.asset-row{display:grid;grid-template-columns:86px minmax(0,1fr) 64px;align-items:center;gap:8px;font-size:13px}.bar{height:8px;border-radius:999px;background:#e7edf3;overflow:hidden}.bar i{display:block;height:100%}.bar.up i{background:var(--green)}.bar.down i{background:var(--red)}.bar.neutral i{background:var(--amber)}.sector-board,.stock-picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stock-picks{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.sector-tile,.stock-card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px}.stock-card{min-height:138px}.sector-tile b{display:block;font-size:13px;margin-bottom:4px}.sector-tile span{color:var(--muted);font-size:12px}.stock-head{display:flex;justify-content:space-between;gap:8px;align-items:start;margin-bottom:8px}.stock-name{font-weight:760}.stock-ticker{color:var(--muted);font-size:12px}.stock-badge{border-radius:999px;padding:2px 8px;font-size:12px;background:#eef6f3;color:var(--green);white-space:nowrap}.stock-badge.watch{background:#fff6e8;color:var(--amber)}.stock-badge.risk{background:#fff0ee;color:var(--red)}.stock-card p{font-size:13px;margin:0 0 7px}.logic-chain{display:grid;gap:8px;counter-reset:chain}.logic-step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;font-size:13px;align-items:start}.logic-step:before{counter-increment:chain;content:counter(chain);width:24px;height:24px;display:grid;place-items:center;border-radius:999px;background:#e8f5f6;color:var(--teal);font-weight:750}.word-cloud{min-height:184px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px 12px;padding:12px;border-radius:8px;background:#fff;border:1px solid var(--line);overflow:visible}.word-cloud span{display:inline-block;position:relative;padding:3px 4px;border-radius:5px;font-weight:780;line-height:1;white-space:nowrap;cursor:help;outline:none}.word-cloud span[data-note]:hover:after,.word-cloud span[data-note]:focus:after{content:attr(data-note);position:absolute;z-index:20;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);width:min(270px,72vw);padding:10px 12px;border-radius:8px;background:#17212b;color:#fff;box-shadow:0 12px 28px rgba(21,29,38,.24);font-size:12px;font-weight:520;line-height:1.45;text-align:left;white-space:normal}.word-cloud .w1{font-size:13px;opacity:.78}.word-cloud .w2{font-size:16px}.word-cloud .w3{font-size:20px}.word-cloud .w4{font-size:25px}.word-cloud .w5{font-size:31px}.word-cloud .bull{color:var(--green)}.word-cloud .bear{color:var(--red)}.word-cloud .neutral{color:#eab308}.cloud-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px;color:var(--muted);font-size:12px}.cloud-legend i{width:8px;height:8px;display:inline-block;border-radius:999px;margin-right:5px}.bull-dot{background:var(--green)}.bear-dot{background:var(--red)}.neutral-dot{background:#eab308}.risk-list{display:grid;gap:8px}.risk-item{display:grid;grid-template-columns:8px minmax(0,1fr);gap:8px;font-size:13px}.risk-dot{width:8px;height:8px;border-radius:999px;margin-top:7px;background:var(--amber)}.risk-dot.high{background:var(--red)}.risk-dot.low{background:var(--green)}.positive{color:var(--green);font-weight:700}.negative{color:var(--red);font-weight:700}.watch{color:var(--amber);font-weight:700}.source-line{color:var(--muted);font-size:12px}.note{padding:18px 22px;margin-top:18px;color:var(--muted);font-size:13px}.empty{padding:18px;color:var(--muted)}@media(max-width:1180px){.page-shell{grid-template-columns:1fr}.history-sidebar{position:static}.brief-grid{grid-template-columns:1fr}}@media(max-width:760px){main{width:min(100% - 20px,1860px);padding-top:12px}.module-grid,.sector-board,.stock-picks{grid-template-columns:1fr}.brief-header{flex-direction:column}.brief-time{text-align:left}.news-item{grid-template-columns:1fr}.word-cloud{min-height:148px}}
  </style>
</head>
<body>
<main>
<div hidden><!-- A_H_UPDATED_START --><!-- A_H_UPDATED_END --><!-- US_UPDATED_START --><!-- US_UPDATED_END --></div>
<div class="page-shell">
<aside class="history-sidebar panel" aria-label="历史简报日历">
  <div class="calendar-window">
    <div class="calendar-month"><span id="calendar-title">历史简报</span><span id="calendar-short">--</span></div>
    <div class="calendar-grid" id="calendar-grid"><span class="dow">一</span><span class="dow">二</span><span class="dow">三</span><span class="dow">四</span><span class="dow">五</span><span class="dow">六</span><span class="dow">日</span></div>
  </div>
  <div class="history-legend"><span><i></i>A/H</span><span><i></i>US</span></div>
</aside>
<section class="history-stage">
  <div class="record-banner panel"><strong>最新市场简报</strong><span id="record-meta">正在读取归档...</span></div>
  <section class="brief-grid">
    <article class="brief panel" id="a-h-brief"><div class="brief-header"><div><div class="brief-kicker">Asia Morning</div><h2>A股港股早报</h2></div><div class="brief-time" id="ah-time"><!-- A_H_TIME_START --><!-- A_H_TIME_END --></div></div><div class="brief-content" id="ah-content"><!-- A_H_BRIEF_START --><div class="panel empty">正在读取最新 A/H 简报...</div><!-- A_H_BRIEF_END --></div></article>
    <article class="brief panel" id="us-brief"><div class="brief-header"><div><div class="brief-kicker">US Premarket</div><h2>美股盘前简报</h2></div><div class="brief-time" id="us-time"><!-- US_TIME_START --><!-- US_TIME_END --></div></div><div class="brief-content" id="us-content"><!-- US_BRIEF_START --><div class="panel empty">正在读取最新 US 简报...</div><!-- US_BRIEF_END --></div></article>
  </section>
  <p class="note panel">提示：历史内容已迁移到 <code>history/data/YYYY-MM-DD.json</code>，日期页使用 <code>history/?date=YYYY-MM-DD</code> 读取渲染；首页日历由 <code>history/manifest.json</code> 自动生成。</p>
</section>
</div>
</main>
<script>
(function(){
  var zhMonths = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var dows = ['一','二','三','四','五','六','日'];
  var grid = document.getElementById('calendar-grid');
  var title = document.getElementById('calendar-title');
  var shortTitle = document.getElementById('calendar-short');
  var meta = document.getElementById('record-meta');
  var ahContent = document.getElementById('ah-content');
  var usContent = document.getElementById('us-content');
  var ahTime = document.getElementById('ah-time');
  var usTime = document.getElementById('us-time');
  function typeKey(type){return String(type || '').toUpperCase().replace('/','');}
  function hasType(record, type){return (record.types || []).some(function(item){return typeKey(item) === type;});}
  function esc(text){return String(text == null ? '' : text).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
  function renderCalendar(records){
    var latest = records[0] || {date:new Date().toISOString().slice(0,10),types:[]};
    var parts = latest.date.split('-').map(Number);
    var year = parts[0], month = parts[1];
    var map = {};
    records.forEach(function(record){map[record.date] = record;});
    title.textContent = year + ' 年 ' + month + ' 月';
    shortTitle.textContent = zhMonths[month - 1];
    grid.innerHTML = dows.map(function(day){return '<span class="dow">' + day + '</span>';}).join('');
    var first = new Date(year, month - 1, 1);
    var offset = (first.getDay() + 6) % 7;
    var days = new Date(year, month, 0).getDate();
    for(var i = 0; i < offset; i += 1){grid.insertAdjacentHTML('beforeend','<span></span>');}
    for(var day = 1; day <= days; day += 1){
      var date = year + '-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var record = map[date];
      if(record){
        var cls = [];
        if(date === latest.date){cls.push('active');}
        if(hasType(record,'AH')){cls.push('has-ah');}
        if(hasType(record,'US')){cls.push('has-us');}
        grid.insertAdjacentHTML('beforeend','<a class="' + cls.join(' ') + '" href="history/?date=' + date + '" title="' + esc(record.title || date) + '">' + day + '</a>');
      }else{
        grid.insertAdjacentHTML('beforeend','<span>' + day + '</span>');
      }
    }
  }
  function latestOf(records, type){return records.find(function(record){return hasType(record,type);});}
  function renderEntry(target, timeTarget, data, type){
    var entry = (data.entries || []).find(function(item){return typeKey(item.type) === type || typeKey(item.label).indexOf(type) >= 0;});
    if(!entry){target.innerHTML = '<div class="panel empty">这个日期没有对应简报。</div>';return '';}
    target.innerHTML = entry.html || '<div class="panel empty">归档内容为空。</div>';
    timeTarget.textContent = entry.updated || data.updated || data.date || '';
    return timeTarget.textContent;
  }
  function loadRecord(record, type, target, timeTarget){
    if(!record){target.innerHTML = '<div class="panel empty">暂无归档。</div>';return Promise.resolve('');}
    return fetch('history/data/' + record.date + '.json', {cache:'no-store'}).then(function(res){
      if(!res.ok){throw new Error(record.date);}
      return res.json();
    }).then(function(data){return renderEntry(target, timeTarget, data, type);}).catch(function(){
      target.innerHTML = '<div class="panel empty">读取 ' + esc(record.date) + ' 归档失败。</div>';
      return '';
    });
  }
  fetch('history/manifest.json', {cache:'no-store'}).then(function(res){return res.json();}).then(function(manifest){
    var records = (manifest.records || []).slice().sort(function(a,b){return b.date.localeCompare(a.date);});
    renderCalendar(records);
    var ah = latestOf(records,'AH');
    var us = latestOf(records,'US');
    return Promise.all([loadRecord(ah,'AH',ahContent,ahTime), loadRecord(us,'US',usContent,usTime)]).then(function(times){
      meta.textContent = ['A/H ' + (times[0] || (ah && ah.date) || '暂无'), 'US ' + (times[1] || (us && us.date) || '暂无')].join(' · ');
    });
  }).catch(function(){
    meta.textContent = '归档清单读取失败';
    ahContent.innerHTML = '<div class="panel empty">无法读取历史清单。</div>';
    usContent.innerHTML = '<div class="panel empty">无法读取历史清单。</div>';
  });
})();
</script>
</body>
</html>
